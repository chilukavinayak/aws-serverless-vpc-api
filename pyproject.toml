[project]
name            = "aws-serverless-vpc-api"
version         = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
addopts    = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that hit a deployed stack",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/*/__init__.py", "src/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under   = 80

[tool.ruff]
target-version = "py312"
line-length    = 100
extend-exclude = [".aws-sam", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "B011"]
