$kind: http-request
url: "{{apiEndpoint}}/vpcs/{{vpcId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('status ACTIVE', () => pm.expect(pm.response.json().data.status).to.eql('ACTIVE'));
    language: text/javascript
order: 4000
