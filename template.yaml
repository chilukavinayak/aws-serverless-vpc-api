AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless VPC provisioning API (API Gateway + Lambda + DynamoDB + Cognito).

Parameters:

  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"

  Environment:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"

  LogLevel:
    Type: String
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  LogRetentionInDays:
    Type: Number
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

  LambdaMemoryMB:
    Type: Number
    MinValue: 128
    MaxValue: 3008

  LambdaTimeoutSeconds:
    Type: Number
    MinValue: 3
    MaxValue: 900

  EnableXRayTracing:
    Type: String
    AllowedValues: ["true", "false"]

  EnablePointInTimeRecovery:
    Type: String
    AllowedValues: ["true", "false"]

  EnableCustomMetrics:
    Type: String
    AllowedValues: ["true", "false"]
    Description: Emit EMF custom metrics (billed beyond 10 free metrics) and API Gateway detailed metrics.

  ApiThrottleBurstLimit:
    Type: Number

  ApiThrottleRateLimit:
    Type: Number

  CognitoPasswordMinLength:
    Type: Number
    MinValue: 8
    MaxValue: 99

  AllowedVpcCidrPrefix:
    Type: String
    Description: Reject VPC CIDRs that do not start with this prefix. Empty string disables the check.

  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: If set, enables the Cognito Hosted UI at <prefix>-<accountId>.auth.<region>.amazoncognito.com.

  OAuthCallbackUrls:
    Type: CommaDelimitedList

  BootstrapUserEmail:
    Type: String
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: If set, creates a Cognito demo user with an auto-generated password stored in Secrets Manager.

Conditions:
  XRayEnabled:      !Equals [!Ref EnableXRayTracing, "true"]
  PitrEnabled:      !Equals [!Ref EnablePointInTimeRecovery, "true"]
  MetricsEnabled:   !Equals [!Ref EnableCustomMetrics, "true"]
  IsProduction:     !Equals [!Ref Environment, "prod"]
  HasHostedUi:      !Not [!Equals [!Ref CognitoDomainPrefix, ""]]
  HasBootstrapUser: !Not [!Equals [!Ref BootstrapUserEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: !Ref LambdaMemoryMB
    Timeout: !Ref LambdaTimeoutSeconds
    Tracing: !If [XRayEnabled, Active, PassThrough]
    Environment:
      Variables:
        LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_METRICS_NAMESPACE: !Sub "${ProjectName}/${Environment}"
        TABLE_NAME: !Ref VpcTable
        PROJECT_NAME: !Ref ProjectName
        ENVIRONMENT: !Ref Environment
        ALLOWED_VPC_CIDR_PREFIX: !Ref AllowedVpcCidrPrefix
        CUSTOM_METRICS_ENABLED: !Ref EnableCustomMetrics
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
  Api:
    TracingEnabled: !If [XRayEnabled, true, false]
    OpenApiVersion: 3.0.1
    MethodSettings:
      - HttpMethod: "*"
        ResourcePath: "/*"
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
        MetricsEnabled: !If [MetricsEnabled, true, false]

Resources:

  VpcTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: !If [IsProduction, Retain, Delete]
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-vpcs"
      # Provisioned 5/5 on table and index stays inside the always-free
      # 25 RCU / 25 WCU tier; on-demand requests are billed from the first one.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: vpc_id
          AttributeType: S
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: vpc_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - AttributeName: owner_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PitrEnabled, true, false]
      SSESpecification:
        SSEEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: !Ref CognitoPasswordMinLength
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: !If [IsProduction, "ON", "OFF"]
      EnabledMfas: !If [IsProduction, [SOFTWARE_TOKEN_MFA], !Ref AWS::NoValue]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-${Environment}-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code, implicit]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref OAuthCallbackUrls
      LogoutURLs: !Ref OAuthCallbackUrls
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasHostedUi
    Properties:
      Domain: !Sub "${CognitoDomainPrefix}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  UserBootstrapFunction:
    Type: AWS::Serverless::Function
    Condition: HasBootstrapUser
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-user-bootstrap"
      CodeUri: src/
      Handler: handlers.user_bootstrap.lambda_handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
        - Statement:
            - Effect: Allow
              Action:
                - ssm:PutParameter
                - ssm:DeleteParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/demo-user-password"

  UserBootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasBootstrapUser
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${UserBootstrapFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  UserBootstrap:
    Type: Custom::UserBootstrap
    Condition: HasBootstrapUser
    Properties:
      ServiceToken: !GetAtt UserBootstrapFunction.Arn
      UserPoolId: !Ref UserPool
      Email: !Ref BootstrapUserEmail
      PasswordParameterName: !Sub "/${ProjectName}/${Environment}/demo-user-password"

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error":"unauthorized","message":"Missing or invalid authentication token"}'
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error":"forbidden","message":"Not authorised to access this resource"}'

  CreateVpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-create-vpc"
      CodeUri: src/
      Handler: handlers.create_vpc.lambda_handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref VpcTable
        - DynamoDBReadPolicy:
            TableName: !Ref VpcTable
        - Statement:
            - Sid: EC2CreateAndDescribe
              Effect: Allow
              Action:
                - ec2:CreateVpc
                - ec2:CreateSubnet
                - ec2:DescribeVpcs
                - ec2:DescribeSubnets
                - ec2:DescribeAvailabilityZones
              Resource: "*"
            - Sid: EC2TagOnCreate
              Effect: Allow
              Action: ec2:CreateTags
              Resource: "*"
              Condition:
                StringEquals:
                  ec2:CreateAction:
                    - CreateVpc
                    - CreateSubnet
            - Sid: EC2ModifyOwnedResources
              Effect: Allow
              Action:
                - ec2:ModifyVpcAttribute
                - ec2:ModifySubnetAttribute
              Resource: "*"
              Condition:
                StringEquals:
                  aws:ResourceTag/ManagedBy: !Ref ProjectName
            - Sid: EC2RollbackOwnedResources
              Effect: Allow
              Action:
                - ec2:DeleteVpc
                - ec2:DeleteSubnet
              Resource: "*"
              Condition:
                StringEquals:
                  aws:ResourceTag/ManagedBy: !Ref ProjectName
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /vpcs
            Method: POST

  GetVpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-get-vpc"
      CodeUri: src/
      Handler: handlers.get_vpc.lambda_handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VpcTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /vpcs/{vpc_id}
            Method: GET

  ListVpcsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-list-vpcs"
      CodeUri: src/
      Handler: handlers.list_vpcs.lambda_handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VpcTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /vpcs
            Method: GET

  DeleteVpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-delete-vpc"
      CodeUri: src/
      Handler: handlers.delete_vpc.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VpcTable
        - Statement:
            - Sid: EC2Describe
              Effect: Allow
              Action:
                - ec2:DescribeVpcs
                - ec2:DescribeSubnets
              Resource: "*"
            - Sid: EC2DeleteOwnedResources
              Effect: Allow
              Action:
                - ec2:DeleteVpc
                - ec2:DeleteSubnet
              Resource: "*"
              Condition:
                StringEquals:
                  aws:ResourceTag/ManagedBy: !Ref ProjectName
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /vpcs/{vpc_id}
            Method: DELETE

  CreateVpcLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateVpcFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  GetVpcLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetVpcFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  ListVpcsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ListVpcsFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  DeleteVpcLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DeleteVpcFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  SsmApiEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name:  !Sub "/${ProjectName}/${Environment}/api-endpoint"
      Type:  String
      Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  SsmUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name:  !Sub "/${ProjectName}/${Environment}/user-pool-id"
      Type:  String
      Value: !Ref UserPool

  SsmUserPoolClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name:  !Sub "/${ProjectName}/${Environment}/user-pool-client-id"
      Type:  String
      Value: !Ref UserPoolClient

  SsmTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name:  !Sub "/${ProjectName}/${Environment}/table-name"
      Type:  String
      Value: !Ref VpcTable

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

  TableName:
    Value: !Ref VpcTable

  Region:
    Value: !Ref AWS::Region

  HostedUiSignInUrl:
    Condition: HasHostedUi
    Value: !Sub
      - "https://${Domain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=token&scope=openid+email+profile&redirect_uri=${RedirectUri}"
      - Domain:      !Ref UserPoolDomain
        RedirectUri: !Select [0, !Ref OAuthCallbackUrls]

  DemoUserEmail:
    Condition: HasBootstrapUser
    Value: !Ref BootstrapUserEmail

  DemoUserPasswordParameter:
    Condition: HasBootstrapUser
    Description: SSM SecureString holding the demo user's password (aws ssm get-parameter --with-decryption)
    Value: !Sub "/${ProjectName}/${Environment}/demo-user-password"
